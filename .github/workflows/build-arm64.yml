name: Build ARM64 Binary

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'force rebuild even if release exists'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get upstream tag
        id: upstream
        run: |
          TAG=$(curl -s 'https://api.github.com/repos/sonroyaalmerol/m3u-stream-merger-proxy/tags?per_page=1' | python3 -c "import sys,json;print(json.load(sys.stdin)[0]['name'])")
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Check skip
        id: check
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo 'skip=false' >> $GITHUB_OUTPUT
            exit 0
          fi
          TAG=${{ steps.upstream.outputs.tag }}
          code=$(curl -s -o /dev/null -w '%{http_code}' https://github.com/${{ github.repository }}/releases/tag/$TAG)
          test "$code" = "200" && echo 'skip=true' >> $GITHUB_OUTPUT || echo 'skip=false' >> $GITHUB_OUTPUT

      - uses: actions/setup-go@v5
        if: steps.check.outputs.skip == 'false'
        with:
          go-version: '1.26'

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip == 'false'
        with:
          repository: sonroyaalmerol/m3u-stream-merger-proxy
          ref: ${{ steps.upstream.outputs.tag }}
          path: source

      - name: Patch env var support
        if: steps.check.outputs.skip == 'false'
        working-directory: ./source
        run: python3 "${GITHUB_WORKSPACE}/.github/scripts/patch_config.py"

      - name: Build
        if: steps.check.outputs.skip == 'false'
        working-directory: ./source
        run: GO111MODULE=on CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags='-s -w' -o m3u-proxy-arm64 .

      - name: Publish
        if: steps.check.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.upstream.outputs.tag }}
          name: ${{ steps.upstream.outputs.tag }}
          body: |
            Auto-built from sonroyaalmerol/m3u-stream-merger-proxy
          files: source/m3u-proxy-arm64
          make_latest: true
