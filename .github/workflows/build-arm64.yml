name: Build ARM64 Binary

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get latest upstream tag
        id: upstream
        run: |
          TAG=$(curl -s 'https://api.github.com/repos/sonroyaalmerol/m3u-stream-merger-proxy/tags?per_page=1' | python3 -c "import sys,json; t=json.load(sys.stdin); print(t[0]['name'] if t else '')")
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Check if already built
        id: check
        run: |
          TAG=${{ steps.upstream.outputs.tag }}
          CODE=$(curl -s -o /dev/null -w '%{http_code}' https://github.com/${{ github.repository }}/releases/tag/$TAG)
          if [ "$CODE" = "200" ]; then echo 'skip=true' >> $GITHUB_OUTPUT; else echo 'skip=false' >> $GITHUB_OUTPUT; fi

      - uses: actions/setup-go@v5
        if: steps.check.outputs.skip == 'false'
        with:
          go-version: '1.26'

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip == 'false'
        with:
          repository: sonroyaalmerol/m3u-stream-merger-proxy
          ref: ${{ steps.upstream.outputs.tag }}
          path: source

      - name: Build ARM64
        if: steps.check.outputs.skip == 'false'
        working-directory: ./source
        run: |
          GO111MODULE=on CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags='-s -w' -o m3u-proxy-arm64 .
          ls -lh m3u-proxy-arm64

      - name: Create git tag and release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${{ steps.upstream.outputs.tag }}
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG" || true
          gh release create "$TAG" ./source/m3u-proxy-arm64 --repo ${{ github.repository }} --title "$TAG" --notes "Auto-built" ||           gh release upload "$TAG" ./source/m3u-proxy-arm64 --repo ${{ github.repository }} --clobber
