name: Build & Package ARM64

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get upstream tag
        id: upstream
        run: |
          TAG=$(curl -s 'https://api.github.com/repos/sonroyaalmerol/m3u-stream-merger-proxy/tags?per_page=1' | python3 -c "import sys,json;print(json.load(sys.stdin)[0]['name'])")
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Check skip
        id: check
        run: |
          TAG=${{ steps.upstream.outputs.tag }}
          code=$(curl -s -o /dev/null -w '%{http_code}' https://github.com/${{ github.repository }}/releases/tag/$TAG)
          test "$code" = "200" && echo 'skip=true' >> $GITHUB_OUTPUT || echo 'skip=false' >> $GITHUB_OUTPUT

      - uses: actions/setup-go@v5
        if: steps.check.outputs.skip == 'false'
        with:
          go-version: '1.26'

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip == 'false'
        with:
          repository: sonroyaalmerol/m3u-stream-merger-proxy
          ref: ${{ steps.upstream.outputs.tag }}
          path: source

      - name: Build binary
        if: steps.check.outputs.skip == 'false'
        working-directory: ./source
        run: GO111MODULE=on CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags='-s -w' -o m3u-proxy-arm64 .

      - name: Package zip
        if: steps.check.outputs.skip == 'false'
        run: |
          TAG=${{ steps.upstream.outputs.tag }}
          mkdir -p package/bin
          cp source/m3u-proxy-arm64 package/bin/
          cp m3u-proxy_monitor_node.js package/
          echo "$TAG" > package/version.txt
          cd package && zip -r ../m3u-proxy.zip . && cd ..
          ls -lh m3u-proxy.zip

      - name: Publish Release
        if: steps.check.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.upstream.outputs.tag }}
          name: ${{ steps.upstream.outputs.tag }}
          body: |
            Auto-built from sonroyaalmerol/m3u-stream-merger-proxy
            
            📦 m3u-proxy.zip 包含:
            - bin/m3u-proxy-arm64 (ARM64 静态二进制)
            - m3u-proxy_monitor_node.js (手机自动更新脚本)
            - version.txt (版本号)
          files: m3u-proxy.zip
          make_latest: true
